<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antworks</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #8ec7e6;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game { display: block; image-rendering: pixelated; cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ======================================================================
       SINGLE-FILE BUILD. index.html + game.js combined into one file so it
       runs from a plain double-click with nothing else alongside it. The
       split version (index.html + game.js) is the one to edit; regenerate
       this file from it, or keep the two in sync by hand.
       ====================================================================== -->
  <script>
/* =========================================================================
   ANTWORKS  —  a tiny dig-'em-up about one ant and a great deal of dirt.
   HTML5 Canvas + vanilla JS, no libraries.

   The surface and the underground are ONE continuous tile map. On the
   surface the ant walks the terrain silhouette and cannot fly up off it.
   Underground — inside tunnels it has dug or found — it moves freely in
   all directions. Dug tiles stay dug.

   SECTION MAP:
      1. CONFIG   2. CANVAS   3. TILES   4. WORLDGEN   5. PLAYER   6. INPUT
      7. CAMERA   8. DIGGING  9. PARTICLES  10. UPDATE  11. RENDER  12. LOOP
   ========================================================================= */

'use strict';

/* --- 1. CONFIG --------------------------------------------------------- */
const CFG = {
  TILE: 32,              // px per tile
  MAP_W: 220,            // tiles wide
  MAP_H: 110,            // tiles tall
  SURFACE_ROW: 22,       // baseline ground row (~20% down the map)

  SPEED: 175,            // ant walk speed, px/sec — snappy, not floaty
  WATER_SLOW: 0.6,       // movement multiplier while wading

  SETTLE_DOWN: 1000,     // px/sec the ant drops back to ground level on the surface
  SETTLE_UP: 1600,       // px/sec the ant clambers up a rise in the terrain

  DIG_TIME_DIRT: 0.45,   // seconds to break one dirt / grass tile
  DIG_TIME_ROCK: 1.7,    // seconds to break one hard-rock tile
  DIG_REACH: 1.7,        // tiles: how far a mouse click may reach to dig
  FILL_COOLDOWN: 0.14,   // seconds between back-fill placements

  CAM_LERP: 9,           // camera follow stiffness (higher = snappier)
  ZOOM_MIN: 0.35,
  ZOOM_MAX: 2.5,
  ZOOM_STEP: 1.12,       // multiply/divide per wheel notch or +/- press
};

/* --- 2. CANVAS ------------------------------------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_W = 0, VIEW_H = 0;

function resize() {
  VIEW_W = canvas.width  = window.innerWidth;
  VIEW_H = canvas.height = window.innerHeight;
  zoomBy(1); // re-clamp zoom so the view never ends up bigger than the map
}
window.addEventListener('resize', resize);

/* --- 3. TILES ---------------------------------------------------------- */
const T = {
  AIR:    0,  // open sky above the ground line
  GRASS:  1,  // the ground cap — solid, and diggable so you can sink a shaft
  DIRT:   2,  // solid, diggable
  ROCK:   3,  // solid, diggable but slow
  WATER:  4,  // walkable, slows you down, not diggable
  TWIG:   5,  // surface pickup — walk over it to collect
  TUNNEL: 6,  // a tile that has been dug out — walkable
};

const SOLID    = { [T.GRASS]: 1, [T.DIRT]: 1, [T.ROCK]: 1 };
const DIGGABLE = { [T.GRASS]: 1, [T.DIRT]: 1, [T.ROCK]: 1 };

const MAP_PX_W = CFG.MAP_W * CFG.TILE;
const MAP_PX_H = CFG.MAP_H * CFG.TILE;

let grid;        // Int8Array, row-major:  index = ty * MAP_W + tx
let surfaceAt;   // Int16Array[MAP_W]: ground row for each column

const clamp    = (v, a, b) => (v < a ? a : v > b ? b : v);
const inBounds = (tx, ty) => tx >= 0 && ty >= 0 && tx < CFG.MAP_W && ty < CFG.MAP_H;
const tIndex   = (tx, ty) => ty * CFG.MAP_W + tx;

// Out-of-bounds reads as solid DIRT so the ant can never leave the map.
const getTile     = (tx, ty) => (inBounds(tx, ty) ? grid[tIndex(tx, ty)] : T.DIRT);
const setTile     = (tx, ty, v) => { if (inBounds(tx, ty)) grid[tIndex(tx, ty)] = v; };
const tileIsSolid = (tx, ty) => !!SOLID[getTile(tx, ty)];

/* --- 4. WORLDGEN ----------------------------------------------------------
   Fill below the surface with DIRT, then stamp rock blobs, carve caves,
   pour puddles, scatter twigs to collect. Returns the tile the ant spawns on.
   -------------------------------------------------------------------------- */
function generateWorld() {
  grid = new Int8Array(CFG.MAP_W * CFG.MAP_H);
  surfaceAt = new Int16Array(CFG.MAP_W);

  // 4a. rolling ground line + solid dirt underneath
  for (let tx = 0; tx < CFG.MAP_W; tx++) {
    const h = Math.round(
      CFG.SURFACE_ROW
      + 3.0 * Math.sin(tx * 0.080)
      + 2.0 * Math.sin(tx * 0.021 + 1.3)
      + 1.5 * Math.sin(tx * 0.005 + 4.0)
    );
    surfaceAt[tx] = h;
    for (let ty = 0; ty < CFG.MAP_H; ty++) {
      if (ty < h)        setTile(tx, ty, T.AIR);
      else if (ty === h) setTile(tx, ty, T.GRASS);
      else               setTile(tx, ty, T.DIRT);
    }
  }

  // 4b. hard-rock blobs, deeper down
  for (let i = 0; i < 90; i++) {
    const cx = 2 + ((Math.random() * (CFG.MAP_W - 4)) | 0);
    const minY = surfaceAt[cx] + 5;
    const cy = minY + ((Math.random() * (CFG.MAP_H - minY - 2)) | 0);
    const r = 2 + ((Math.random() * 2) | 0);   // 2..3 — rounded blobs
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (dx * dx + dy * dy <= r * r && getTile(cx + dx, cy + dy) === T.DIRT)
          setTile(cx + dx, cy + dy, T.ROCK);
  }

  // 4c. pre-existing caves — carve with a wandering brush
  for (let i = 0; i < 16; i++) {
    let cx = 8 + ((Math.random() * (CFG.MAP_W - 16)) | 0);
    let cy = surfaceAt[cx] + 8 + ((Math.random() * (CFG.MAP_H - surfaceAt[cx] - 14)) | 0);
    const steps = 30 + ((Math.random() * 70) | 0);
    for (let s = 0; s < steps; s++) {
      carveBlob(cx, cy, 1 + ((Math.random() * 1.6) | 0));
      cx = clamp(cx + ((Math.random() * 3) | 0) - 1, 2, CFG.MAP_W - 3);
      cy += ((Math.random() * 3) | 0) - 1;
      cy = clamp(cy, surfaceAt[cx] + 4, CFG.MAP_H - 3); // never breach the surface
    }
  }

  // 4d. puddles in the surface dips
  for (let tx = 3; tx < CFG.MAP_W - 3; tx++) {
    if (surfaceAt[tx] > surfaceAt[tx - 1] &&
        surfaceAt[tx] >= surfaceAt[tx + 1] &&
        Math.random() < 0.25) {
      const w = 1 + ((Math.random() * 3) | 0);
      const d = 1 + ((Math.random() * 2) | 0);
      for (let x = tx - w; x <= tx + w; x++) {
        const base = surfaceAt[clamp(x, 0, CFG.MAP_W - 1)];
        for (let y = base; y > base - d; y--) {
          const t = getTile(x, y);
          if (t === T.GRASS || t === T.AIR) setTile(x, y, T.WATER);
        }
      }
    }
  }

  // 4e. twigs sitting on the grass — walk over them to collect
  for (let tx = 1; tx < CFG.MAP_W - 1; tx++) {
    const g = surfaceAt[tx];
    if (getTile(tx, g) === T.GRASS && Math.random() < 0.12) setTile(tx, g - 1, T.TWIG);
  }

  // 4f. clean pocket at the spawn — strip twigs / stray water from the air
  //     above the ground, but keep the ground itself whole (never punch a
  //     hole in the grass cap, or the ant sinks in beside its own start)
  const sx = 12;
  for (let dx = -3; dx <= 3; dx++) {
    const col = sx + dx;
    const g = surfaceAt[col];
    for (let dy = 1; dy <= 4; dy++) {
      const t = getTile(col, g - dy);
      if (t === T.TWIG || t === T.WATER) setTile(col, g - dy, T.AIR);
    }
    if (getTile(col, g) !== T.GRASS) setTile(col, g, T.GRASS);
    if (!SOLID[getTile(col, g + 1)]) setTile(col, g + 1, T.DIRT);
  }
  const sy = surfaceAt[sx] - 1;

  return { sx, sy };
}

function carveBlob(cx, cy, r) {
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      if (dx * dx + dy * dy <= r * r) {
        const t = getTile(cx + dx, cy + dy);
        if (t === T.DIRT || t === T.ROCK) setTile(cx + dx, cy + dy, T.TUNNEL);
      }
}

/* --- 5. PLAYER (the ant) -----------------------------------------------
   Two modes, chosen each frame by computeFreeMove():
     SURFACE   — walk left/right along the terrain silhouette; eased onto
                 the top of the column so it can't fly up or sink through.
                 Up/down only AIM the ant (for digging).
     FREE-MOVE — once inside a tunnel/cave, move in all directions; solids block.
   `face` is the last direction pressed, kept even when a wall blocks the
   move, so Space / click always digs where the ant is pointing.
   -------------------------------------------------------------------------- */
const player = {
  x: 0, y: 0,
  w: 22, h: 14,
  face: { x: 1, y: 0 },
  flip: false,
  freeMove: false,
  depth: 0,
  animPhase: 0,
};

function spawnPlayer(tx, ty) {
  player.x = tx * CFG.TILE + (CFG.TILE - player.w) / 2;
  player.y = ty * CFG.TILE + (CFG.TILE - player.h) / 2;
}

function boxHitsSolid(px, py) {
  const x0 = Math.floor(px / CFG.TILE);
  const y0 = Math.floor(py / CFG.TILE);
  const x1 = Math.floor((px + player.w - 1) / CFG.TILE);
  const y1 = Math.floor((py + player.h - 1) / CFG.TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (tileIsSolid(tx, ty)) return true;
  return false;
}

const boxOverlapsTile = (tx, ty) => {
  const bx = tx * CFG.TILE, by = ty * CFG.TILE;
  return player.x < bx + CFG.TILE && player.x + player.w > bx &&
         player.y < by + CFG.TILE && player.y + player.h > by;
};

// Underground (free movement) or on the surface (terrain walk)? Only "inside
// open dug/cave space" counts — being momentarily sunk into a solid tile while
// climbing a rise must NOT, or the ant wedges itself in the dirt.
function computeFreeMove() {
  const cx   = clamp(Math.floor((player.x + player.w / 2) / CFG.TILE), 0, CFG.MAP_W - 1);
  const cyC  = Math.floor((player.y + player.h / 2) / CFG.TILE);
  const here = getTile(cx, cyC);

  if (here === T.TUNNEL) return true;
  if (player.freeMove && !SOLID[here]) {
    const cyB = Math.floor((player.y + player.h + 3) / CFG.TILE);
    if (getTile(cx, cyB) === T.TUNNEL) return true;   // at a shaft mouth, climbing out
  }
  return false;
}

function movePlayer(dt) {
  const rawX = (keyDown('d', 'arrowright') ? 1 : 0) - (keyDown('a', 'arrowleft') ? 1 : 0);
  const rawY = (keyDown('s', 'arrowdown')  ? 1 : 0) - (keyDown('w', 'arrowup')   ? 1 : 0);

  if (rawX || rawY) {
    player.face = { x: Math.sign(rawX), y: Math.sign(rawY) };
    if (rawX) player.flip = rawX < 0;
  }

  player.freeMove = computeFreeMove();

  const centreTile = getTile(
    Math.floor((player.x + player.w / 2) / CFG.TILE),
    Math.floor((player.y + player.h / 2) / CFG.TILE)
  );
  const speed = CFG.SPEED * (centreTile === T.WATER ? CFG.WATER_SLOW : 1);

  if (player.freeMove) {
    let mx = rawX, my = rawY;
    if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
    const nx = player.x + mx * speed * dt;
    const ny = player.y + my * speed * dt;
    if (!boxHitsSolid(nx, player.y)) player.x = nx;
    if (!boxHitsSolid(player.x, ny)) player.y = ny;
    if (mx || my) player.animPhase += speed * dt * 0.09;
  } else {
    if (rawX) {
      player.x += rawX * speed * dt;
      player.animPhase += speed * dt * 0.09;
    }
    player.x = clamp(player.x, 0, MAP_PX_W - player.w);

    // always scan DOWN from above the ground line for this column's true top,
    // so the ant climbs rising terrain instead of ploughing through; rest on
    // the first solid tile OR the surface of a puddle (waded, not sunk into)
    const cx = clamp(Math.floor((player.x + player.w / 2) / CFG.TILE), 0, CFG.MAP_W - 1);
    let gr = Math.max(0, surfaceAt[cx] - 4);
    while (gr < CFG.MAP_H && !tileIsSolid(cx, gr) && getTile(cx, gr) !== T.WATER) gr++;
    const restY = gr * CFG.TILE - player.h;
    if (player.y < restY)      player.y = Math.min(restY, player.y + CFG.SETTLE_DOWN * dt);
    else if (player.y > restY) player.y = Math.max(restY, player.y - CFG.SETTLE_UP * dt);
  }

  player.x = clamp(player.x, 0, MAP_PX_W - player.w);
  player.y = clamp(player.y, 0, MAP_PX_H - player.h);

  const ptx = clamp(Math.floor((player.x + player.w / 2) / CFG.TILE), 0, CFG.MAP_W - 1);
  const pfy = Math.floor((player.y + player.h) / CFG.TILE);
  player.depth = Math.max(0, pfy - surfaceAt[ptx]);
}

// Walk over a twig to pick it up.
function collectTwigs() {
  const x0 = Math.floor(player.x / CFG.TILE);
  const y0 = Math.floor(player.y / CFG.TILE);
  const x1 = Math.floor((player.x + player.w - 1) / CFG.TILE);
  const y1 = Math.floor((player.y + player.h - 1) / CFG.TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (getTile(tx, ty) === T.TWIG) {
        setTile(tx, ty, T.AIR);
        twigs++;
        puff(tx * CFG.TILE + CFG.TILE / 2, ty * CFG.TILE + CFG.TILE / 2, false);
      }
}

/* --- 6. INPUT -------------------------------------------------------------- */
const keys = new Set();
const mouse = { x: 0, y: 0, down: false };

const keyDown = (...names) => names.some((n) => keys.has(n));
const norm = (k) => (k === ' ' ? 'space' : k.toLowerCase());

window.addEventListener('keydown', (e) => {
  const k = norm(e.key);
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'space'].includes(k)) e.preventDefault();
  if (k === '+' || k === '=') zoomBy(CFG.ZOOM_STEP);
  if (k === '-' || k === '_') zoomBy(1 / CFG.ZOOM_STEP);
  keys.add(k);
});
window.addEventListener('keyup', (e) => keys.delete(norm(e.key)));
window.addEventListener('blur', () => keys.clear());

canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => { mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? CFG.ZOOM_STEP : 1 / CFG.ZOOM_STEP);
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* --- 7. CAMERA ---------------------------------------------------------- */
const cam = { x: 0, y: 0, zoom: 1 };

function zoomBy(factor) {
  cam.zoom = clamp(cam.zoom * factor, CFG.ZOOM_MIN, CFG.ZOOM_MAX);
  cam.zoom = Math.max(cam.zoom, VIEW_W / MAP_PX_W, VIEW_H / MAP_PX_H);
}

function updateCamera(dt) {
  const viewWunits = VIEW_W / cam.zoom;
  const viewHunits = VIEW_H / cam.zoom;
  const targetX = player.x + player.w / 2 - viewWunits / 2;
  const targetY = player.y + player.h / 2 - viewHunits / 2;

  const t = 1 - Math.exp(-CFG.CAM_LERP * dt);   // frame-rate-independent smoothing
  cam.x += (targetX - cam.x) * t;
  cam.y += (targetY - cam.y) * t;

  cam.x = clamp(cam.x, 0, Math.max(0, MAP_PX_W - viewWunits));
  cam.y = clamp(cam.y, 0, Math.max(0, MAP_PX_H - viewHunits));
}

const worldToScreen = (wx, wy) => ({ x: (wx - cam.x) * cam.zoom, y: (wy - cam.y) * cam.zoom });
const screenToWorld = (sx, sy) => ({ x: sx / cam.zoom + cam.x, y: sy / cam.zoom + cam.y });

/* --- 8. DIGGING (and back-filling) ------------------------------------- */
const digProgress = new Map();   // "tx,ty" -> seconds worked so far (persists between visits)
let digTarget = null;
let tilesDug = 0;
let dirtCarried = 0;
let twigs = 0;
let fillCooldown = 0;

function pickDigTarget() {
  if (mouse.down) {
    const w = screenToWorld(mouse.x, mouse.y);
    const tx = Math.floor(w.x / CFG.TILE);
    const ty = Math.floor(w.y / CFG.TILE);
    const pcx = (player.x + player.w / 2) / CFG.TILE;
    const pcy = (player.y + player.h / 2) / CFG.TILE;
    if (DIGGABLE[getTile(tx, ty)] &&
        Math.hypot(tx + 0.5 - pcx, ty + 0.5 - pcy) <= CFG.DIG_REACH + 0.5) {
      return { tx, ty };
    }
  }
  if (keys.has('space')) {
    const d = aimVec();
    const probeX = player.x + player.w / 2 + d.x * (player.w / 2 + CFG.TILE * 0.35);
    const probeY = player.y + player.h / 2 + d.y * (player.h / 2 + CFG.TILE * 0.35);
    const tx = Math.floor(probeX / CFG.TILE);
    const ty = Math.floor(probeY / CFG.TILE);
    if (DIGGABLE[getTile(tx, ty)]) return { tx, ty };
  }
  return null;
}

// The ant's aim as a direction vector (never zero).
function aimVec() {
  if (player.face.x || player.face.y) return player.face;
  return { x: player.flip ? -1 : 1, y: 0 };
}

function updateDigging(dt) {
  digTarget = pickDigTarget();
  if (!digTarget) return;

  const { tx, ty } = digTarget;
  const key = tx + ',' + ty;
  const need = getTile(tx, ty) === T.ROCK ? CFG.DIG_TIME_ROCK : CFG.DIG_TIME_DIRT;
  const worked = (digProgress.get(key) || 0) + dt;

  if (worked >= need) {
    const wasRock = getTile(tx, ty) === T.ROCK;
    setTile(tx, ty, T.TUNNEL);           // dug tiles stay dug — never regenerated
    digProgress.delete(key);
    tilesDug++;
    dirtCarried += wasRock ? 2 : 1;
    puff(tx * CFG.TILE + CFG.TILE / 2, ty * CFG.TILE + CFG.TILE / 2, wasRock);
  } else {
    digProgress.set(key, worked);
  }
}

// Where a back-fill goes. Standing still, you fill the tile you aim at. While
// walking, you seal the tunnel BEHIND you as you retreat — and a tile you're
// actively pressing into is never chosen, so a fill can't wall the ant in.
function fillTargetTile() {
  const cx = Math.floor((player.x + player.w / 2) / CFG.TILE);
  const cy = Math.floor((player.y + player.h / 2) / CFG.TILE);
  const d = aimVec();
  const walking = keyDown('a', 'arrowleft', 'd', 'arrowright', 'w', 'arrowup', 's', 'arrowdown');
  const pressingInto = (ox, oy) =>
    (ox > 0 && keyDown('d', 'arrowright')) || (ox < 0 && keyDown('a', 'arrowleft')) ||
    (oy > 0 && keyDown('s', 'arrowdown'))  || (oy < 0 && keyDown('w', 'arrowup'));

  const cands = walking
    ? [[-d.x, -d.y], [0, 1], [d.x, d.y], [0, -1], [1, 0], [-1, 0]]
    : [[d.x, d.y], [0, 1], [-d.x, -d.y], [0, -1], [1, 0], [-1, 0]];

  for (const [ox, oy] of cands) {
    if ((!ox && !oy) || pressingInto(ox, oy)) continue;
    const tx = cx + ox, ty = cy + oy;
    if (getTile(tx, ty) === T.TUNNEL && !boxOverlapsTile(tx, ty)) return { tx, ty };
  }
  return null;
}

function updateFill(dt) {
  fillCooldown -= dt;
  if (!keys.has('f') || dirtCarried <= 0 || fillCooldown > 0) return;

  const tgt = fillTargetTile();
  if (!tgt) return;

  setTile(tgt.tx, tgt.ty, T.DIRT);
  dirtCarried--;
  tilesDug = Math.max(0, tilesDug - 1);
  puff(tgt.tx * CFG.TILE + CFG.TILE / 2, tgt.ty * CFG.TILE + CFG.TILE / 2, false);
  fillCooldown = CFG.FILL_COOLDOWN;
}

/* --- 9. PARTICLES (dirt puffs on dig / fill / twig pickup) ---------------- */
const particles = [];

function puff(x, y, rock) {
  const n = rock ? 16 : 11;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 20 + Math.random() * 70;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 20,
      life: 0.5 + Math.random() * 0.4,
      max: 0.9,
      r: 1 + Math.random() * 2.5,
      col: rock ? '#8d8d8d' : (Math.random() < 0.5 ? '#6b4326' : '#7d5233'),
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 260 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 2.5 * dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* --- 10. UPDATE --------------------------------------------------------- */
function update(dt) {
  movePlayer(dt);
  collectTwigs();
  updateDigging(dt);
  updateFill(dt);
  updateParticles(dt);
  updateCamera(dt);
}

/* --- 11. RENDER ------------------------------------------------------------ */
let nowMs = 0;
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;

function tileTint(tx, ty) {
  let h = (tx * 73856093) ^ (ty * 19349663);
  return ((h >>> 0) % 17) - 8;   // -8 .. +8
}

function render() {
  ctx.fillStyle = '#8ec7e6';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  drawTiles();
  drawDigOverlay();
  drawParticles();
  drawAnt();

  ctx.restore();

  drawLighting();
  drawHUD();
}

function drawTiles() {
  const S = CFG.TILE;
  const x0 = Math.max(0, Math.floor(cam.x / S));
  const y0 = Math.max(0, Math.floor(cam.y / S));
  const x1 = Math.min(CFG.MAP_W - 1, Math.ceil((cam.x + VIEW_W / cam.zoom) / S));
  const y1 = Math.min(CFG.MAP_H - 1, Math.ceil((cam.y + VIEW_H / cam.zoom) / S));

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const v = grid[tIndex(tx, ty)];
      const px = tx * S, py = ty * S;
      const n = tileTint(tx, ty);

      switch (v) {
        case T.AIR:
          break;

        case T.TUNNEL:
          ctx.fillStyle = rgb(42 + n, 31 + n, 25 + n);
          ctx.fillRect(px, py, S, S);
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(px, py, S, 3);
          break;

        case T.GRASS:
          ctx.fillStyle = rgb(120 + n, 78 + n, 46 + n);
          ctx.fillRect(px, py, S, S);
          ctx.fillStyle = rgb(78 + n, 138 + n, 62 + n);
          ctx.fillRect(px, py, S, 7);
          break;

        case T.DIRT:
          ctx.fillStyle = rgb(120 + n, 78 + n, 46 + n);
          ctx.fillRect(px, py, S, S);
          ctx.fillStyle = rgb(95 + n, 60 + n, 34 + n);
          ctx.fillRect(px + ((tx * 11) % (S - 6)), py + ((ty * 7) % (S - 6)), 3, 3);
          ctx.fillRect(px + ((tx * 19 + 5) % (S - 4)), py + ((ty * 13 + 9) % (S - 4)), 2, 2);
          break;

        case T.ROCK:
          ctx.fillStyle = rgb(120 + n, 120 + n, 128 + n);
          ctx.fillRect(px, py, S, S);
          ctx.fillStyle = rgb(99 + n, 99 + n, 107 + n);
          ctx.fillRect(px + 4, py + 4, S - 8, S - 8);
          break;

        case T.WATER: {
          ctx.fillStyle = rgb(58, 120, 190);
          ctx.fillRect(px, py, S, S);
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          const wob = Math.sin(nowMs * 0.002 + tx * 0.6) * 2;
          ctx.fillRect(px, py + 4 + wob, S, 3);
          break;
        }

        case T.TWIG: {
          ctx.strokeStyle = rgb(122, 84, 48);
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          const bx = px + 7, by = py + S - 8;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + 15, by - 9);
          ctx.moveTo(bx + 9, by - 5.4);
          ctx.lineTo(bx + 14, by - 1);
          ctx.stroke();
          ctx.lineCap = 'butt';
          break;
        }
      }
    }
  }
}

function drawDigOverlay() {
  const S = CFG.TILE;

  for (const [key, worked] of digProgress) {
    const [tx, ty] = key.split(',').map(Number);
    const need = getTile(tx, ty) === T.ROCK ? CFG.DIG_TIME_ROCK : CFG.DIG_TIME_DIRT;
    const f = clamp(worked / need, 0, 1);
    const px = tx * S, py = ty * S;

    ctx.fillStyle = `rgba(0,0,0,${0.15 + 0.4 * f})`;
    ctx.fillRect(px + (f * S) / 2, py + (f * S) / 2, S - f * S, S - f * S);

    ctx.strokeStyle = '#ffd479';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(px + S / 2, py + S / 2, S * 0.32, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2);
    ctx.stroke();
  }

  if (digTarget) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    ctx.strokeRect(digTarget.tx * S + 1, digTarget.ty * S + 1, S - 2, S - 2);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
}

function drawAnt() {
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  const wig = Math.sin(player.animPhase) * 2;

  // point the ant along its aim vector; when it faces left-ish, mirror
  // vertically so the belly stays down instead of drawing upside-down
  let fx = player.face.x, fy = player.face.y;
  if (!fx && !fy) { fx = player.flip ? -1 : 1; fy = 0; }
  const ang = Math.atan2(fy, fx);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  if (Math.cos(ang) < -0.001) ctx.scale(1, -1);

  ctx.strokeStyle = '#20130b';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    const lx = -6 + i * 6;
    const k = i % 2 ? wig : -wig;
    ctx.beginPath();
    ctx.moveTo(lx, 0); ctx.lineTo(lx - 3, 6 + k);
    ctx.moveTo(lx, 0); ctx.lineTo(lx - 3, -6 - k);
    ctx.stroke();
  }

  ctx.fillStyle = '#241009';
  dot(-7, 0, 6, 5);
  dot(0, 0, 4, 3.5);
  dot(7, 0, 3.6, 3.6);

  ctx.strokeStyle = '#241009';
  ctx.beginPath();
  ctx.moveTo(9, -1); ctx.lineTo(13, -4);
  ctx.moveTo(9, 1);  ctx.lineTo(13, 4);
  ctx.stroke();

  ctx.fillStyle = '#ffcf6b';
  ctx.fillRect(10, -1.5, 3, 3);

  if (dirtCarried > 0) {
    ctx.fillStyle = '#7d5233';
    ctx.beginPath();
    ctx.arc(-9, -5, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  function dot(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Underground gloom that closes in with depth.
function drawLighting() {
  if (player.depth <= 2) return;
  const k = clamp((player.depth - 2) / 30, 0, 1) * 0.66;
  const s = worldToScreen(player.x + player.w / 2, player.y + player.h / 2);
  const R = 260 * cam.zoom;

  const g = ctx.createRadialGradient(s.x, s.y, R * 0.18, s.x, s.y, R);
  g.addColorStop(0.0, 'rgba(0,0,0,0)');
  g.addColorStop(0.6, `rgba(0,0,0,${k * 0.45})`);
  g.addColorStop(1.0, `rgba(0,0,0,${k})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawHUD() {
  ctx.font = '13px "Segoe UI", system-ui, sans-serif';
  ctx.textBaseline = 'top';

  const help = [
    'ANTWORKS',
    'WASD / Arrows   move & aim',
    'Space (aim at dirt)   dig',
    'Click dirt   dig',
    'F   fill a tunnel (uses dirt)',
    'Wheel  or  + / -   zoom',
  ];
  panel(10, 10, 220, help.length * 17 + 12);
  help.forEach((line, i) => {
    ctx.fillStyle = i === 0 ? '#ffcf6b' : '#e9e9e9';
    ctx.fillText(line, 20, 18 + i * 17);
  });

  const stats = [
    ['Tiles dug', tilesDug],
    ['Dirt carried', dirtCarried],
    ['Twigs', twigs],
    ['Depth', player.depth],
    ['Zoom', cam.zoom.toFixed(2) + 'x'],
  ];
  const pw = 176, rx = VIEW_W - pw - 10;
  panel(rx, 10, pw, stats.length * 17 + 12);
  stats.forEach(([label, val], i) => {
    ctx.fillStyle = '#9fb4c8';
    ctx.fillText(label, rx + 10, 18 + i * 17);
    ctx.fillStyle = '#f2f2f2';
    ctx.textAlign = 'right';
    ctx.fillText(String(val), rx + pw - 10, 18 + i * 17);
    ctx.textAlign = 'left';
  });
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(15,12,10,0.68)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w, h);
}

/* --- 12. LOOP + BOOTSTRAP -------------------------------------------------- */
let last = 0;

function frame(ts) {
  nowMs = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;

  update(dt);
  render();
  requestAnimationFrame(frame);
}

function init() {
  resize();
  const spawn = generateWorld();
  spawnPlayer(spawn.sx, spawn.sy);

  cam.zoom = 1;
  const vw = VIEW_W / cam.zoom, vh = VIEW_H / cam.zoom;
  cam.x = clamp(player.x + player.w / 2 - vw / 2, 0, Math.max(0, MAP_PX_W - vw));
  cam.y = clamp(player.y + player.h / 2 - vh / 2, 0, Math.max(0, MAP_PX_H - vh));

  requestAnimationFrame(frame);
}

init();
  </script>
</body>
