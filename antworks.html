<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #79c1e8;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #game { display: block; cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Single-file build: index.html + game.js welded together so it runs from
       a plain double-click. Edit the split version and regenerate this. -->
  <script>
/* =========================================================================
   ANTWORKS  —  a dig-and-build game about one ant and a great deal of dirt.

   HTML5 Canvas + vanilla JS. No build step: just open index.html.

   The surface and the underground are ONE continuous tile map. Gravity is
   always on: the ant walks, and it falls whenever nothing is underfoot — it
   never flies. Up / down climb only while it's gripping a wall (a solid tile
   at its side), which is how you get back up a shaft you dug; there is no
   jump. Dug tiles become open sky; you can pack a carried block back into ANY
   empty tile — underground or up in the air.

   SECTION MAP:
      1. CONFIG        constants + palette
      2. CANVAS        context + responsive resize
      3. TILES         tile ids, lookup tables, grid helpers
      4. WORLDGEN      procedural map: soil, rock, caves
      5. PLAYER        the ant: gravity-walk vs. free dig-move, collision
      6. INPUT         keyboard / mouse / wheel
      7. CAMERA        smooth follow + edge clamp + zoom
      8. DIG & BUILD   excavate a tile / place a carried block anywhere
      9. PARTICLES     spoil flecks
     10. UPDATE        per-frame simulation
     11. RENDER        sky, layered soil, the ant, HUD
     12. LOOP          requestAnimationFrame + bootstrap

   WHERE TO EXTEND LATER  (search for  "EXTEND:"  inline):
     - food / resources ....... add a tile id + an overlap pickup in update()
     - other insects .......... entities[] + simple AI; reuse tileIsSolid()
     - oxygen / light meter ... player.depth tracks how deep you are
     - save / load ............ `grid` is a plain Int8Array
     - perf ................... cache the static tile layer to an offscreen canvas
   ========================================================================= */

'use strict';

/* ---------------------------------------------------------------------------
   1. CONFIG
   ------------------------------------------------------------------------- */
const CFG = {
  TILE: 32,
  MAP_W: 220,
  MAP_H: 110,
  SURFACE_ROW: 22,

  SPEED: 175,            // ant move speed, px/sec

  GRAVITY: 1500,         // px/sec^2 — gentle; this is not a platformer
  MAX_FALL: 620,
  STEP_UP: 40,           // px the ant auto-climbs over a one-tile lip while walking

  DIG_TIME_DIRT: 0.45,   // seconds to break one soil tile
  DIG_TIME_ROCK: 1.7,    // seconds to break one rock tile
  DIG_REACH: 1.8,        // tiles a mouse click may reach
  BUILD_COOLDOWN: 0.11,  // seconds between placed blocks

  CAM_LERP: 9,
  ZOOM_MIN: 0.35,
  ZOOM_MAX: 2.5,
  ZOOM_STEP: 1.12,
};

// Warm daytime palette — one committed look, no light/dark theming.
const C = {
  skyTop:  '#3f97d1',
  skyMid:  '#79c1e8',
  skyLow:  '#c2e6f6',
  dirtHi:  '#d59259',   // sun-warmed topsoil
  dirtLow: '#7c4c2d',   // deep earth
  rock:    '#6f7d8c',
  rockHi:  '#93a0ae',
  ink:     '#38240f',   // the ant
  cream:   '#f7eedd',
  gold:    '#f5c247',
  panel:   'rgba(40,27,18,0.76)',
};
const FONT = '"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif';

/* ---------------------------------------------------------------------------
   2. CANVAS
   ------------------------------------------------------------------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_W = 0, VIEW_H = 0;

function resize() {
  VIEW_W = canvas.width  = window.innerWidth;
  VIEW_H = canvas.height = window.innerHeight;
  zoomBy(1); // re-clamp zoom so the view never ends up bigger than the map
}
window.addEventListener('resize', resize);

/* ---------------------------------------------------------------------------
   3. TILES
   ------------------------------------------------------------------------- */
const T = { AIR: 0, DIRT: 1, ROCK: 2 };

const SOLID    = { [T.DIRT]: 1, [T.ROCK]: 1 };
const DIGGABLE = { [T.DIRT]: 1, [T.ROCK]: 1 };

const MAP_PX_W = CFG.MAP_W * CFG.TILE;
const MAP_PX_H = CFG.MAP_H * CFG.TILE;

let grid;        // Int8Array, row-major:  index = ty * MAP_W + tx
let surfaceAt;   // Int16Array[MAP_W]: first solid row for each column

const clamp    = (v, a, b) => (v < a ? a : v > b ? b : v);
const inBounds = (tx, ty) => tx >= 0 && ty >= 0 && tx < CFG.MAP_W && ty < CFG.MAP_H;
const tIndex   = (tx, ty) => ty * CFG.MAP_W + tx;

// Out-of-bounds reads as solid DIRT so the ant can never leave the map.
const getTile     = (tx, ty) => (inBounds(tx, ty) ? grid[tIndex(tx, ty)] : T.DIRT);
const setTile     = (tx, ty, v) => { if (inBounds(tx, ty)) grid[tIndex(tx, ty)] = v; };
const tileIsSolid = (tx, ty) => !!SOLID[getTile(tx, ty)];

/* ---------------------------------------------------------------------------
   4. WORLDGEN
   ------------------------------------------------------------------------- */
function generateWorld() {
  grid = new Int8Array(CFG.MAP_W * CFG.MAP_H);
  surfaceAt = new Int16Array(CFG.MAP_W);

  // 4a. rolling ground line + solid soil beneath
  for (let tx = 0; tx < CFG.MAP_W; tx++) {
    const h = Math.round(
      CFG.SURFACE_ROW
      + 3.0 * Math.sin(tx * 0.080)
      + 2.0 * Math.sin(tx * 0.021 + 1.3)
      + 1.5 * Math.sin(tx * 0.005 + 4.0)
    );
    surfaceAt[tx] = h;
    for (let ty = 0; ty < CFG.MAP_H; ty++) setTile(tx, ty, ty < h ? T.AIR : T.DIRT);
  }

  // 4b. rock veins, deeper down
  for (let i = 0; i < 90; i++) {
    const cx = 2 + ((Math.random() * (CFG.MAP_W - 4)) | 0);
    const minY = surfaceAt[cx] + 5;
    const cy = minY + ((Math.random() * (CFG.MAP_H - minY - 2)) | 0);
    const r = 2 + ((Math.random() * 2) | 0);
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (dx * dx + dy * dy <= r * r && getTile(cx + dx, cy + dy) === T.DIRT)
          setTile(cx + dx, cy + dy, T.ROCK);
  }

  // 4c. pre-existing hollows — carve with a wandering brush (they read as sky)
  for (let i = 0; i < 16; i++) {
    let cx = 8 + ((Math.random() * (CFG.MAP_W - 16)) | 0);
    let cy = surfaceAt[cx] + 8 + ((Math.random() * (CFG.MAP_H - surfaceAt[cx] - 14)) | 0);
    const steps = 30 + ((Math.random() * 70) | 0);
    for (let s = 0; s < steps; s++) {
      carveBlob(cx, cy, 1 + ((Math.random() * 1.6) | 0));
      cx = clamp(cx + ((Math.random() * 3) | 0) - 1, 2, CFG.MAP_W - 3);
      cy += ((Math.random() * 3) | 0) - 1;
      cy = clamp(cy, surfaceAt[cx] + 4, CFG.MAP_H - 3); // stay well below the surface
    }
  }

  return { sx: 12, sy: surfaceAt[12] - 1 };
}

function carveBlob(cx, cy, r) {
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      if (dx * dx + dy * dy <= r * r && SOLID[getTile(cx + dx, cy + dy)])
        setTile(cx + dx, cy + dy, T.AIR);
}

/* ---------------------------------------------------------------------------
   5. PLAYER  (the ant)
   ------------------------------------------------------------------------- */
const player = {
  x: 0, y: 0,
  w: 22, h: 14,
  vy: 0,
  face: { x: 1, y: 0 },   // last direction pressed, kept even when a wall blocks it
  flip: false,
  depth: 0,
  animPhase: 0,
};

function spawnPlayer(tx, ty) {
  player.x = tx * CFG.TILE + (CFG.TILE - player.w) / 2;
  player.y = ty * CFG.TILE + (CFG.TILE - player.h) / 2;
}

function boxHitsSolid(px, py) {
  const x0 = Math.floor(px / CFG.TILE);
  const y0 = Math.floor(py / CFG.TILE);
  const x1 = Math.floor((px + player.w - 1) / CFG.TILE);
  const y1 = Math.floor((py + player.h - 1) / CFG.TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (tileIsSolid(tx, ty)) return true;
  return false;
}

const boxOverlapsTile = (tx, ty) => {
  const bx = tx * CFG.TILE, by = ty * CFG.TILE;
  return player.x < bx + CFG.TILE && player.x + player.w > bx &&
         player.y < by + CFG.TILE && player.y + player.h > by;
};

// Is there a solid tile in the column just left or right of the ant, alongside
// its body? An ant with a wall to grip can climb it (this is how you get back
// up a one-wide shaft); out in open space — a wide cavern, the sky — there's
// nothing to hold, so it just falls. No flying.
function grippingWall() {
  const y0 = Math.floor(player.y / CFG.TILE);
  const y1 = Math.floor((player.y + player.h - 1) / CFG.TILE);
  const lc = Math.floor(player.x / CFG.TILE) - 1;
  const rc = Math.floor((player.x + player.w - 1) / CFG.TILE) + 1;
  for (let ty = y0; ty <= y1; ty++)
    if (tileIsSolid(lc, ty) || tileIsSolid(rc, ty)) return true;
  return false;
}

function movePlayer(dt) {
  const ix = (keyDown('d', 'arrowright') ? 1 : 0) - (keyDown('a', 'arrowleft') ? 1 : 0);
  const iy = (keyDown('s', 'arrowdown')  ? 1 : 0) - (keyDown('w', 'arrowup')   ? 1 : 0);
  if (ix || iy) {
    player.face = { x: Math.sign(ix), y: Math.sign(iy) };
    if (ix) player.flip = ix < 0;
  }

  const step = CFG.SPEED * dt;

  // ---- horizontal ---- (auto-climb an open one-tile lip; a wall with soil
  // above it still blocks, so you can't "stair-step" up an enclosed shaft)
  if (ix) {
    const dx = ix * step;
    if (!boxHitsSolid(player.x + dx, player.y)) {
      player.x += dx;
    } else {
      for (let lift = 8; lift <= CFG.STEP_UP; lift += 8) {
        if (!boxHitsSolid(player.x + dx, player.y - lift)) {
          player.x += dx;
          player.y -= lift;
          break;
        }
      }
    }
    player.animPhase += step * 0.09;
  }

  // ---- vertical ---- climb only while gripping a wall; otherwise gravity.
  // There is no jump anywhere, above ground or below.
  if (iy && grippingWall()) {
    player.vy = 0;
    const dy = iy * step;
    if (!boxHitsSolid(player.x, player.y + dy)) player.y += dy;
    player.animPhase += step * 0.09;
  } else {
    player.vy = Math.min(player.vy + CFG.GRAVITY * dt, CFG.MAX_FALL);
    const dy = player.vy * dt;
    if (!boxHitsSolid(player.x, player.y + dy)) {
      player.y += dy;
    } else {
      let s = Math.max(1, Math.ceil(dy));
      while (s-- > 0 && !boxHitsSolid(player.x, player.y + 1)) player.y += 1;
      player.vy = 0;
    }
  }

  player.x = clamp(player.x, 0, MAP_PX_W - player.w);
  player.y = clamp(player.y, 0, MAP_PX_H - player.h);

  let safety = CFG.TILE;
  while (safety-- > 0 && boxHitsSolid(player.x, player.y)) player.y -= 1;

  const ptx = clamp(Math.floor((player.x + player.w / 2) / CFG.TILE), 0, CFG.MAP_W - 1);
  const pfy = Math.floor((player.y + player.h) / CFG.TILE);
  player.depth = Math.max(0, pfy - surfaceAt[ptx]);
}

/* ---------------------------------------------------------------------------
   6. INPUT
   ------------------------------------------------------------------------- */
const keys = new Set();
const mouse = { x: 0, y: 0, down: false };

const keyDown = (...names) => names.some((n) => keys.has(n));
const norm = (k) => (k === ' ' ? 'space' : k.toLowerCase());

window.addEventListener('keydown', (e) => {
  const k = norm(e.key);
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'space'].includes(k)) e.preventDefault();
  if (k === '+' || k === '=') zoomBy(CFG.ZOOM_STEP);
  if (k === '-' || k === '_') zoomBy(1 / CFG.ZOOM_STEP);
  keys.add(k);
});
window.addEventListener('keyup', (e) => keys.delete(norm(e.key)));
window.addEventListener('blur', () => keys.clear());

canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => { mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? CFG.ZOOM_STEP : 1 / CFG.ZOOM_STEP);
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------------------------------------------------------------------
   7. CAMERA
   ------------------------------------------------------------------------- */
const cam = { x: 0, y: 0, zoom: 1 };

function zoomBy(factor) {
  cam.zoom = clamp(cam.zoom * factor, CFG.ZOOM_MIN, CFG.ZOOM_MAX);
  cam.zoom = Math.max(cam.zoom, VIEW_W / MAP_PX_W, VIEW_H / MAP_PX_H);
}

function updateCamera(dt) {
  const vw = VIEW_W / cam.zoom, vh = VIEW_H / cam.zoom;
  const tx = player.x + player.w / 2 - vw / 2;
  const ty = player.y + player.h / 2 - vh / 2;
  const t = 1 - Math.exp(-CFG.CAM_LERP * dt);
  cam.x += (tx - cam.x) * t;
  cam.y += (ty - cam.y) * t;
  cam.x = clamp(cam.x, 0, Math.max(0, MAP_PX_W - vw));
  cam.y = clamp(cam.y, 0, Math.max(0, MAP_PX_H - vh));
}

const worldToScreen = (wx, wy) => ({ x: (wx - cam.x) * cam.zoom, y: (wy - cam.y) * cam.zoom });
const screenToWorld = (sx, sy) => ({ x: sx / cam.zoom + cam.x, y: sy / cam.zoom + cam.y });

/* ---------------------------------------------------------------------------
   8. DIG & BUILD
   ------------------------------------------------------------------------- */
const digProgress = new Map();
let digTarget = null;
let tilesDug = 0;
let blocks = 0;               // carried soil you can place
let buildCooldown = 0;

function aimVec() {
  if (player.face.x || player.face.y) return player.face;
  return { x: player.flip ? -1 : 1, y: 0 };
}

function pickDigTarget() {
  if (mouse.down) {
    const w = screenToWorld(mouse.x, mouse.y);
    const tx = Math.floor(w.x / CFG.TILE);
    const ty = Math.floor(w.y / CFG.TILE);
    const pcx = (player.x + player.w / 2) / CFG.TILE;
    const pcy = (player.y + player.h / 2) / CFG.TILE;
    if (DIGGABLE[getTile(tx, ty)] &&
        Math.hypot(tx + 0.5 - pcx, ty + 0.5 - pcy) <= CFG.DIG_REACH + 0.5) {
      return { tx, ty };
    }
  }
  if (keys.has('space')) {
    const d = aimVec();
    const px = player.x + player.w / 2 + d.x * (player.w / 2 + CFG.TILE * 0.35);
    const py = player.y + player.h / 2 + d.y * (player.h / 2 + CFG.TILE * 0.35);
    const tx = Math.floor(px / CFG.TILE);
    const ty = Math.floor(py / CFG.TILE);
    if (DIGGABLE[getTile(tx, ty)]) return { tx, ty };
  }
  return null;
}

function updateDigging(dt) {
  digTarget = pickDigTarget();
  if (!digTarget) return;

  const { tx, ty } = digTarget;
  const key = tx + ',' + ty;
  const need = getTile(tx, ty) === T.ROCK ? CFG.DIG_TIME_ROCK : CFG.DIG_TIME_DIRT;
  const worked = (digProgress.get(key) || 0) + dt;

  if (worked >= need) {
    const wasRock = getTile(tx, ty) === T.ROCK;
    setTile(tx, ty, T.AIR);              // the hole shows the sky through
    digProgress.delete(key);
    tilesDug++;
    blocks += wasRock ? 2 : 1;
    puff(tx * CFG.TILE + CFG.TILE / 2, ty * CFG.TILE + CFG.TILE / 2, wasRock);
  } else {
    digProgress.set(key, worked);
  }
}

// Tile the ant is aiming at, if a block could be placed there.
function buildTargetTile() {
  const d = aimVec();
  const cx = Math.floor((player.x + player.w / 2) / CFG.TILE) + d.x;
  const cy = Math.floor((player.y + player.h / 2) / CFG.TILE) + d.y;
  if (getTile(cx, cy) === T.AIR && !boxOverlapsTile(cx, cy) && inBounds(cx, cy)) {
    return { tx: cx, ty: cy };
  }
  return null;
}

// F places a carried block into that tile — anywhere, sky or soil.
function updateBuild(dt) {
  buildCooldown -= dt;
  if (!keys.has('f') || blocks <= 0 || buildCooldown > 0) return;
  const tgt = buildTargetTile();
  if (!tgt) return;
  setTile(tgt.tx, tgt.ty, T.DIRT);
  blocks--;
  tilesDug = Math.max(0, tilesDug - 1);
  puff(tgt.tx * CFG.TILE + CFG.TILE / 2, tgt.ty * CFG.TILE + CFG.TILE / 2, false);
  buildCooldown = CFG.BUILD_COOLDOWN;
}

/* ---------------------------------------------------------------------------
   9. PARTICLES
   ------------------------------------------------------------------------- */
const particles = [];

function puff(x, y, rock) {
  const n = rock ? 15 : 10;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 20 + Math.random() * 70;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 20,
      life: 0.45 + Math.random() * 0.4,
      max: 0.85,
      r: 1.5 + Math.random() * 2,
      rot: Math.random() * Math.PI,
      col: rock ? C.rockHi : (Math.random() < 0.5 ? C.dirtHi : C.dirtLow),
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 300 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 2.5 * dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---------------------------------------------------------------------------
   10. UPDATE
   ------------------------------------------------------------------------- */
function update(dt) {
  movePlayer(dt);
  updateDigging(dt);
  updateBuild(dt);
  updateParticles(dt);
  updateCamera(dt);
}

/* ---------------------------------------------------------------------------
   11. RENDER
   ------------------------------------------------------------------------- */

// hex "#rrggbb" -> "rgb(...)" blended
function hexLerp(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ar = A >> 16, ag = (A >> 8) & 255, ab = A & 255;
  const br = B >> 16, bg = (B >> 8) & 255, bb = B & 255;
  return `rgb(${Math.round(ar + (br - ar) * t)},${Math.round(ag + (bg - ag) * t)},${Math.round(ab + (bb - ab) * t)})`;
}

// Pre-rendered 32x32 tile stamps: 6 soil depth-shades + 1 rock.
const STAMP = { dirt: [] };
function buildStamps() {
  const S = CFG.TILE;
  const mk = (draw) => {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    draw(c.getContext('2d'), S);
    return c;
  };

  for (let b = 0; b < 6; b++) {
    const t = b / 5;
    STAMP.dirt[b] = mk((g) => {
      g.fillStyle = hexLerp(C.dirtHi, C.dirtLow, t);
      g.fillRect(0, 0, S, S);
      g.fillStyle = 'rgba(255,239,214,0.16)';   // sunlit stratum line
      g.fillRect(0, 0, S, 4);
      g.fillStyle = 'rgba(48,28,14,0.20)';
      g.fillRect(6, 10, 3, 3); g.fillRect(20, 7, 2, 2);
      g.fillRect(13, 21, 3, 3); g.fillRect(25, 24, 2, 2);
      g.fillStyle = 'rgba(255,239,214,0.07)';
      g.fillRect(4, 17, 2, 2); g.fillRect(22, 15, 2, 2);
    });
  }

  STAMP.rock = mk((g) => {
    g.fillStyle = C.rock;
    g.fillRect(0, 0, S, S);
    g.fillStyle = C.rockHi;
    g.beginPath();
    g.moveTo(4, S - 6); g.lineTo(12, 6); g.lineTo(S - 6, 10); g.lineTo(S - 4, S - 8);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.fillRect(0, 0, S, 4);
    g.strokeStyle = 'rgba(18,24,32,0.22)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(12, 6); g.lineTo(4, S - 6);
    g.moveTo(12, 6); g.lineTo(S - 6, 10);
    g.stroke();
    g.fillStyle = 'rgba(18,24,32,0.22)';
    g.fillRect(7, S - 11, 4, 4); g.fillRect(S - 12, S - 12, 3, 3);
  });
}

function render() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, C.skyTop);
  sky.addColorStop(0.55, C.skyMid);
  sky.addColorStop(1, C.skyLow);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const sun = ctx.createRadialGradient(VIEW_W * 0.83, VIEW_H * 0.14, 8, VIEW_W * 0.83, VIEW_H * 0.14, 260);
  sun.addColorStop(0, 'rgba(255,250,235,0.33)');
  sun.addColorStop(1, 'rgba(255,250,235,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  drawTiles();
  drawBuildGhost();
  drawDigOverlay();
  drawParticles();
  drawAnt();

  ctx.restore();

  drawLighting();
  drawHUD();
}

function drawTiles() {
  const S = CFG.TILE;
  const x0 = Math.max(0, Math.floor(cam.x / S));
  const y0 = Math.max(0, Math.floor(cam.y / S));
  const x1 = Math.min(CFG.MAP_W - 1, Math.ceil((cam.x + VIEW_W / cam.zoom) / S));
  const y1 = Math.min(CFG.MAP_H - 1, Math.ceil((cam.y + VIEW_H / cam.zoom) / S));

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const v = grid[tIndex(tx, ty)];
      if (v === T.AIR) continue;
      const px = tx * S, py = ty * S;

      if (v === T.ROCK) {
        ctx.drawImage(STAMP.rock, px, py);
      } else {
        const band = clamp(Math.floor((ty - surfaceAt[tx]) / 8), 0, 5);
        ctx.drawImage(STAMP.dirt[band], px, py);
      }

      // per-tile fleck so the tiling doesn't read as wallpaper
      const tj = ((tx * 73856093) ^ (ty * 19349663)) >>> 0;
      if (tj & 4) {
        ctx.fillStyle = v === T.ROCK ? 'rgba(18,24,32,0.16)' : 'rgba(48,28,14,0.15)';
        ctx.fillRect(px + (tj % 26), py + ((tj >> 5) % 26), 2, 2);
      }
      // soft rim of shade where soil meets open air above
      if (getTile(tx, ty - 1) === T.AIR) {
        ctx.fillStyle = 'rgba(0,0,0,0.10)';
        ctx.fillRect(px, py, S, 3);
      }
    }
  }
}

function drawBuildGhost() {
  if (!keys.has('f') || blocks <= 0) return;
  const tgt = buildTargetTile();
  if (!tgt) return;
  const S = CFG.TILE;
  ctx.fillStyle = 'rgba(213,146,89,0.4)';
  ctx.fillRect(tgt.tx * S + 3, tgt.ty * S + 3, S - 6, S - 6);
  ctx.strokeStyle = 'rgba(247,238,221,0.85)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(tgt.tx * S + 3, tgt.ty * S + 3, S - 6, S - 6);
}

function drawDigOverlay() {
  const S = CFG.TILE;

  for (const [key, worked] of digProgress) {
    const [tx, ty] = key.split(',').map(Number);
    const need = getTile(tx, ty) === T.ROCK ? CFG.DIG_TIME_ROCK : CFG.DIG_TIME_DIRT;
    const f = clamp(worked / need, 0, 1);
    const mx = tx * S + S / 2, my = ty * S + S / 2;

    ctx.strokeStyle = 'rgba(247,238,221,0.8)';
    ctx.lineWidth = 1.6;
    for (let a = 0; a < 6; a++) {
      const th = (a / 6) * Math.PI * 2 + 0.3;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + Math.cos(th) * S * 0.4 * f, my + Math.sin(th) * S * 0.4 * f);
      ctx.stroke();
    }
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(mx, my, S * 0.33, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2);
    ctx.stroke();
  }

  if (digTarget) {
    ctx.strokeStyle = 'rgba(247,238,221,0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(digTarget.tx * S + 2, digTarget.ty * S + 2, S - 4, S - 4);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.col;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot + (p.max - p.life) * 7);
    ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawAnt() {
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  const wig = Math.sin(player.animPhase) * 2;

  let fx = player.face.x, fy = player.face.y;
  if (!fx && !fy) { fx = player.flip ? -1 : 1; fy = 0; }
  const ang = Math.atan2(fy, fx);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  if (Math.cos(ang) < -0.001) ctx.scale(1, -1);
  ctx.scale(1.15, 1.15);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const legs = () => {
    for (let i = 0; i < 3; i++) {
      const lx = -6 + i * 6;
      const k = i % 2 ? wig : -wig;
      ctx.beginPath();
      ctx.moveTo(lx, 0); ctx.lineTo(lx - 4, 7 + k);
      ctx.moveTo(lx, 0); ctx.lineTo(lx - 4, -7 - k);
      ctx.stroke();
    }
  };
  ctx.strokeStyle = C.cream; ctx.lineWidth = 3.6; legs();
  ctx.strokeStyle = C.ink;   ctx.lineWidth = 1.7; legs();

  const body = () => {
    ctx.moveTo(-0.6, 0);  ctx.ellipse(-7, 0, 6.4, 5.4, 0, 0, Math.PI * 2);
    ctx.moveTo(4.2, 0);   ctx.ellipse(0, 0, 4.2, 3.8, 0, 0, Math.PI * 2);
    ctx.moveTo(11, 0);    ctx.ellipse(7, 0, 4, 4, 0, 0, Math.PI * 2);
  };
  ctx.strokeStyle = C.cream; ctx.lineWidth = 3;
  ctx.beginPath(); body(); ctx.stroke();
  ctx.fillStyle = C.ink;
  ctx.beginPath(); body(); ctx.fill();

  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.moveTo(9, -1.6); ctx.lineTo(13.5, -5);
  ctx.moveTo(9, 1.6);  ctx.lineTo(13.5, 5);
  ctx.stroke();

  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(11.5, 0, 2.3, 0, Math.PI * 2); ctx.fill();

  if (blocks > 0) {
    ctx.fillStyle = C.dirtHi;
    ctx.strokeStyle = C.cream;
    ctx.lineWidth = 1.4;
    ctx.fillRect(-12.5, -9, 5.5, 5.5);
    ctx.strokeRect(-12.5, -9, 5.5, 5.5);
  }

  ctx.restore();
}

// Going deep, a warm shadow closes in around a lamp-lit disc.
function drawLighting() {
  if (player.depth <= 3) return;
  const k = clamp((player.depth - 3) / 34, 0, 1) * 0.6;
  const s = worldToScreen(player.x + player.w / 2, player.y + player.h / 2);
  const R = 300 * cam.zoom;
  const g = ctx.createRadialGradient(s.x, s.y, R * 0.16, s.x, s.y, R);
  g.addColorStop(0.0, 'rgba(22,12,6,0)');
  g.addColorStop(0.55, `rgba(22,12,6,${k * 0.45})`);
  g.addColorStop(1.0, `rgba(22,12,6,${k})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function panel(x, y, w, h) {
  ctx.fillStyle = C.panel;
  rr(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  rr(x + 0.5, y + 0.5, w - 1, h - 1, 11.5); ctx.stroke();
}

function drawHUD() {
  ctx.textBaseline = 'alphabetic';

  // controls, top-left
  const cw = 236, ch = 128;
  panel(16, 16, cw, ch);
  ctx.fillStyle = C.gold;
  ctx.font = '800 17px ' + FONT;
  ctx.fillText('ANTWORKS', 32, 42);
  const rows = [
    ['Move / aim', 'WASD'],
    ['Dig', 'Space / click'],
    ['Place block', 'F'],
    ['Zoom', 'wheel · + −'],
  ];
  ctx.font = '600 12.5px ' + FONT;
  rows.forEach(([a, b], i) => {
    const y = 66 + i * 16;
    ctx.fillStyle = 'rgba(247,238,221,0.6)';
    ctx.textAlign = 'left';
    ctx.fillText(a, 32, y);
    ctx.fillStyle = C.cream;
    ctx.textAlign = 'right';
    ctx.fillText(b, 16 + cw - 16, y);
  });
  ctx.textAlign = 'left';

  // stats, top-right
  const sw = 148, sh = 102;
  const sx = VIEW_W - 16 - sw;
  panel(sx, 16, sw, sh);
  const stats = [['DUG', tilesDug], ['BLOCKS', blocks], ['DEPTH', player.depth]];
  stats.forEach(([a, b], i) => {
    const y = 46 + i * 26;
    ctx.font = '700 11px ' + FONT;
    ctx.fillStyle = 'rgba(247,238,221,0.58)';
    ctx.textAlign = 'left';
    ctx.fillText(a, sx + 16, y);
    ctx.font = '800 18px ' + FONT;
    ctx.fillStyle = C.cream;
    ctx.textAlign = 'right';
    ctx.fillText(String(b), sx + sw - 16, y);
  });
  ctx.textAlign = 'left';
}

/* ---------------------------------------------------------------------------
   12. LOOP + BOOTSTRAP
   ------------------------------------------------------------------------- */
let last = 0;

function frame(ts) {
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function init() {
  resize();
  buildStamps();
  const spawn = generateWorld();
  spawnPlayer(spawn.sx, spawn.sy);

  cam.zoom = 1;
  const vw = VIEW_W / cam.zoom, vh = VIEW_H / cam.zoom;
  cam.x = clamp(player.x + player.w / 2 - vw / 2, 0, Math.max(0, MAP_PX_W - vw));
  cam.y = clamp(player.y + player.h / 2 - vh / 2, 0, Math.max(0, MAP_PX_H - vh));

  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 15px "Nunito"').catch(() => {});
    document.fonts.load('800 15px "Nunito"').catch(() => {});
  }
  requestAnimationFrame(frame);
}

init();
  </script>
</body>
